    - build_prod_debian_12
    - build_prod_alpine_3_20
    - build_prod_rockylinux_9
    - build_prod_fedora_40
    - build_prod_windows
    - build_prod_android
  needs:
    - job: build_prod_ubuntu_22_04
      artifacts: true
    - job: build_prod_ubuntu_24_04
      artifacts: true
    - job: build_prod_debian_12
      artifacts: true
    - job: build_prod_alpine_3_20
      artifacts: true
    - job: build_prod_rockylinux_9
      artifacts: true
    - job: build_prod_fedora_40
      artifacts: true
    - job: build_prod_windows
      artifacts: true
    - job: build_prod_android
      artifacts: true


# ============================================================
# 发布到 Package Registry（tag 时触发，按系统分 job，版本带系统）
# ============================================================

publish_package_ubuntu_22_04:
  stage: release
  tags:
    - docker
  variables:
    BUILD_DIR: "build"
    PLATFORM: "ubuntu-22.04"
    PACKAGE_NAME: "astroproject-ubuntu-22.04"
    ARCH: "x86_64"
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="$CI_COMMIT_TAG"
      else
        PACKAGE_VERSION="v${CI_COMMIT_SHORT_SHA}"
      fi
      export PACKAGE_VERSION
      echo "Determined package version: $PACKAGE_VERSION"
  script:
    - |
      export ARTIFACT_NAME="astroproject-${PLATFORM}-${ARCH}-prod.tar.gz"
      echo "Uploading ${PLATFORM} artifact to GitLab Package Registry"
      echo "Package: ${PACKAGE_NAME} / ${PACKAGE_VERSION} / ${ARTIFACT_NAME}"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "astroproject/${BUILD_DIR}/${ARTIFACT_NAME}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${ARTIFACT_NAME}"
      echo "Published OK: ${ARTIFACT_NAME}"
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build_prod_ubuntu_22_04
  needs:
    - job: build_prod_ubuntu_22_04
      artifacts: true

