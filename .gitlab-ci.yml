# ============================================================
# 阶段（stage）设计 —— 遵循 GitLab CE 惯例，并按职责重新命名/归位
#
#   prepare  准备与协作自动化：MR 描述生成、合并后回写 MR 备注
#   build    构建：编译源码并打包成可分发制品
#   verify   验证：校验 build 产出的制品（质量门禁）
#   deploy   部署：按环境发布制品（dev / test / prod）
#   release  发布：创建 GitLab Release 并发布软件包
#
# 相比原配置的修正：
#   1. 原 gene_mrdesc（生成 MR 描述）被塞在 build 阶段、
#      add_mr_note（MR 备注）被塞在 deploy 阶段，语义完全不符，
#      现统一归入新增的 prepare 阶段。
#   2. 原 test 阶段下挂着 unit_test_* 作业，但本项目 CMakeLists
#      并未定义任何单元测试目标（无 gtest/catch，也没有
#      test_astro_lib_debugd），实际做的是产物校验，名不副实；
#      故更名为 verify。日后若在 CMakeLists 中加入真实单测，
#      可再拆出独立的 test 阶段。
# ============================================================
stages:
  - prepare
  - build
  - verify
  - deploy
  - release

# 防止 push 与 merge_request 触发重复流水线（GitLab 官方推荐写法）
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.variables_template: &variables_definition
  BUILD_DIR: "build"
  ARTIFACT_NAME: "astroproject.tar.gz"
  PACKAGE_NAME: "astroproject"

variables:
  <<: *variables_definition

# ==== 本平台适配：单一共享 docker runner ====
# 原设计依赖「每台环境机一个 runner」+ 在真实 OS 上 sudo 装依赖。
# 本平台宿主机仅 16GB，无法同时跑多台环境机，故改为：
#   一台 docker runner + 镜像提供构建环境，dev/test/prod 由分支规则区分。
default:
  image: gcc:12
  before_script:
    - |
      # 尽力而为的依赖安装：
      #  - 有的镜像以 root 跑(无 sudo)，有的以普通用户跑且没有 sudo -> 无 sudo 则置空
      #  - 有的镜像没有包管理器(curlimages/curl 等) -> 跳过即可
      #  - 任何情况下都不得让 job 失败，非构建类 job 请用 before_script: [] 直接跳过
      if [ "$(id -u)" = "0" ]; then SUDO=""; else SUDO="sudo"; fi
      command -v sudo >/dev/null 2>&1 || SUDO=""
      if ! command -v cmake >/dev/null 2>&1; then
        echo "cmake 缺失，尝试安装构建工具链..."
        if command -v apt-get >/dev/null 2>&1; then
          # 加速：默认源 deb.debian.org 在本网络下极慢（8.6MB 的 cmake 要数分钟），
          # 且每个 job 都是全新容器、都要重装一遍。改用国内镜像可把安装压到数秒。
          if [ "$(id -u)" = "0" ]; then
            for _f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
              [ -f "$_f" ] && sed -i 's|deb.debian.org|mirrors.aliyun.com|g; s|security.debian.org|mirrors.aliyun.com|g' "$_f"
            done || true
          fi
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq cmake make g++ \
            || echo "WARN: 构建工具链安装失败(权限或网络)，继续尝试"
        elif command -v apk >/dev/null 2>&1; then
          $SUDO apk add --no-cache cmake make g++ \
            || echo "WARN: 构建工具链安装失败(权限或网络)，继续尝试"
        elif command -v yum >/dev/null 2>&1; then
          $SUDO yum install -y cmake make gcc-c++ \
            || echo "WARN: 构建工具链安装失败(权限或网络)，继续尝试"
        else
          echo "WARN: 未找到受支持的包管理器，跳过依赖安装"
        fi
      fi
      cmake --version || echo "WARN: 本镜像无 cmake，需要编译的 job 会失败"

# 构建作业模板 
.build_template: &build_definition
  stage: build
  # 不定义 before_script -> 继承 default.before_script（含 apt 镜像加速 + cmake 安装）
  # 原模板自带一份重复的多 OS 依赖安装逻辑，且会覆盖 default，导致镜像加速失效，已移除
  script:
    - mkdir -p astroproject/${BUILD_DIR}
    - cd astroproject/${BUILD_DIR}
    - cmake ../ -DCMAKE_BUILD_TYPE=Release
    - cmake --build .
    - |
      # 打包（已修正）：
      #  - CMakeLists 的 CMAKE_ARCHIVE_OUTPUT_DIRECTORY_RELEASE 指向
      #    astroproject/lib/linux/Release/ ，原脚本按 build/lib/*.a 取，路径不符
      #  - 原脚本引用的 astro_lib.h 全项目不存在，真实头文件是 include/astrolog_lib.h
      #  - 改为打包整个 include/ 目录树，避免只拷一个头文件导致子目录依赖缺失
      mkdir -p pkg/lib pkg/include
      cp ../lib/linux/Release/*.a pkg/lib/
      cp -r ../include/. pkg/include/
      tar -czvf ${ARTIFACT_NAME} -C pkg lib include
      ls -alrt ${ARTIFACT_NAME}
      # 注意：不要写成 tar -tzf x | head -20 —— head 提前关闭管道会让 tar 收到
      # SIGPIPE(退出码 141)，runner 开了 pipefail 会把整个 job 判失败。
      echo "打包内容清单(前 20 项):"
      tar -tzf ${ARTIFACT_NAME} > /tmp/_pkg_list.txt
      head -20 /tmp/_pkg_list.txt
      echo "包内文件总数: $(wc -l < /tmp/_pkg_list.txt)"
  artifacts:
    paths:
      - astroproject/${BUILD_DIR}/${ARTIFACT_NAME}
    expire_in: 1 week
    name: "astroproject-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"

# 验证作业模板（质量门禁）
# 合并说明：
#  原配置有 test / coverage 两个模板，内容几乎完全重复（都是 Debug 重新编译 + 校验），
#  且 unit_test_dev 继承 coverage、unit_test_test/prod 继承 test —— 同名作业行为不一致。
#  现合并为单一模板，三个环境行为统一。
#
# 效率说明：
#  原模板会用 Debug 再完整编译一遍（build 阶段已编译过 Release），编译耗时翻倍。
#  最佳实践是「验证你要发布的东西」，故改为直接校验 build 阶段产出的制品，不再重复编译，
#  同时也不需要 cmake，可用 before_script: [] 省掉依赖安装。
.verify_template: &verify_definition
  stage: verify
  image: gcc:12
  before_script: []   # 仅校验制品，不需要 cmake
  script:
    - |
      ARTIFACT="astroproject/${BUILD_DIR}/${ARTIFACT_NAME}"
      echo "== 校验 build 阶段产出的制品 =="
      test -f "$ARTIFACT" || { echo "FAIL: 未找到制品 $ARTIFACT"; exit 1; }
      ls -l "$ARTIFACT"

      rm -rf _verify && mkdir -p _verify
      tar -xzf "$ARTIFACT" -C _verify

      # 1) 必须包含静态库，且非空
      LIB=$(find _verify -name '*.a' | head -1)
      test -n "$LIB" || { echo "FAIL: 制品中没有静态库(.a)"; exit 1; }
      OBJCNT=$(ar t "$LIB" | wc -l)
      echo "静态库: $LIB  目标文件数: $OBJCNT"
      test "$OBJCNT" -gt 0 || { echo "FAIL: 静态库为空"; exit 1; }

      # 2) 必须包含公开头文件
      HDR=$(find _verify -name 'astrolog_lib.h' | head -1)
      test -n "$HDR" || { echo "FAIL: 制品缺少公开头文件 astrolog_lib.h"; exit 1; }
      echo "头文件: $HDR"

      # 3) 覆盖率/单测：若日后 CMakeLists 定义了对应目标则执行，未定义则跳过（非错误）
      COVBIN=$(find _verify -name 'test_astro_lib_coverage' | head -1)
      if [ -n "$COVBIN" ]; then
        echo "发现覆盖率测试程序，执行中..."
        "$COVBIN"
      else
        echo "注: 项目 CMakeLists 未定义覆盖率/单测目标，跳过（非错误）"
      fi

      echo "VERIFY PASSED"
  allow_failure: false   # 质量门禁，不允许静默失败

# 开发环境构建
build_dev:
  <<: *build_definition
  variables:
    <<: *variables_definition
    ENVIRONMENT: "development"
  tags:
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"  
    - if: ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID ) && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"

# 测试环境构建
build_test:
  <<: *build_definition
  variables:
    <<: *variables_definition
    ENVIRONMENT: "testing"
  tags:
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "test"
    - if: ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID ) && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "test"

# 生产环境构建
build_prod:
  <<: *build_definition
  variables:
    <<: *variables_definition
    ENVIRONMENT: "production"
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID ) && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"

# 开发环境验证（质量门禁：校验 build_dev 产出的制品）
verify_dev:
  <<: *verify_definition
  needs:
    - job: build_dev
      artifacts: true
  tags:
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
    - if: ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID ) && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"

# 测试环境验证（质量门禁：校验 build_test 产出的制品）
verify_test:
  <<: *verify_definition
  needs:
    - job: build_test
      artifacts: true
  tags:
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "test"
    - if: ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID ) && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "test"

# 生产环境验证（质量门禁：校验 build_prod 产出的制品）
verify_prod:
  <<: *verify_definition
  needs:
    - job: build_prod
      artifacts: true
  tags:
    - docker
  rules:
    # 关键修复：原规则缺少 $CI_COMMIT_TAG，导致打 tag 发布生产时
    # 验证作业不运行，而 deploy_to_prod 又 needs 它 —— 生产链路要么断裂、
    # 要么绕过质量门禁。补上 tag 规则，确保发布前必过验证。
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    - if: ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_MERGE_REQUEST_ID ) && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"

# 在新建一个合并请求的时候，自动生成合并请求页面概览和描述
gene_mrdesc:
  stage: prepare   # 原为 build，语义不符：这是协作自动化，不是构建
  image: curlimages/curl:latest
  before_script:
    - 'echo "Current directory: $(pwd)"'
    - 'echo "HOME directory: $HOME"'
    - 'echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"'
    - 'echo "Checking and installing required tools..."'
    - if ! command -v jq &> /dev/null; then echo "jq not found, attempting to install..."; if command -v apk &> /dev/null; then apk add --no-cache jq; elif command -v apt-get &> /dev/null; then apt-get update && apt-get install -y jq; elif command -v yum &> /dev/null; then yum install -y jq; elif command -v dnf &> /dev/null; then dnf install -y jq; elif command -v pkg &> /dev/null; then pkg install -y jq; elif command -v zypper &> /dev/null; then zypper install -y jq; else echo "Package manager not found. Please install jq manually."; exit 1; fi; else echo "jq is already installed"; jq --version; fi
    - if ! command -v bash &> /dev/null; then echo "bash not found, attempting to install..."; if command -v apk &> /dev/null; then apk add --no-cache bash; elif command -v apt-get &> /dev/null; then apt-get update && apt-get install -y bash; elif command -v yum &> /dev/null; then yum install -y bash; elif command -v dnf &> /dev/null; then dnf install -y bash; elif command -v pkg &> /dev/null; then pkg install -y bash; elif command -v zypper &> /dev/null; then zypper install -y bash; else echo "Package manager not found. Please install bash manually."; exit 1; fi; else echo "bash is already installed"; bash --version; fi
  script:
    - 'echo "正在为合并请求生成描述内容..."'
    - pwd
    - ls -la
    - ls -la scripts/
    - PROJECT_DIR="$HOME/$CI_PROJECT_DIR"
    - 'echo "Project directory: $PROJECT_DIR"'
    - chmod +x "$PROJECT_DIR/scripts/generate_mr_description.sh"
    - chmod +x "$PROJECT_DIR/scripts/add_mr_note.sh"
    - /usr/local/bin/bash "$PROJECT_DIR/scripts/generate_mr_description.sh"
  tags:
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # 注意在GitlabCE中设置好个人访问令牌后立马复制，并在添加PERSONAL_ACCESS_TOKEN时注意受保护选择是否勾选，类似于 create_release 作业
    GITLAB_TOKEN: $PERSONAL_ACCESS_TOKEN


# 当点击合并，合并代码成功后会提交到目标分支，触发deploy 作业，并添加注释
add_mr_note:
  stage: prepare   # 原为 deploy，语义不符：这是 MR 通知，不是部署
  script:
    - 'echo "正在为合并请求添加注释..."'
    - PROJECT_DIR="$HOME/$CI_PROJECT_DIR"
    - 'echo "Project directory: $PROJECT_DIR"'
    # 提取合并请求 IID ，基于合并请求，在点击合并时会生成一个提交，提交信息CI_COMMIT_MESSAGE中包含合并请求的 IID，详情可以在GitlabCE页面项目中“提交”下查看，生成的CI_COMMIT_MESSAGE
    - |
      if echo "$CI_COMMIT_MESSAGE" | grep -q "See merge request"; then
        MR_IID=$(echo "$CI_COMMIT_MESSAGE" | grep "See merge request" | grep -o "!.*" | sed 's/!//')
      else
        MR_IID=$(echo $CI_COMMIT_MESSAGE | grep -o "Merge branch.*into.*" | grep -o "Merge branch '[^']*' \(#[0-9]*\)" | grep -o "#[0-9]*" | sed 's/#//')
      fi
    - 'echo "Extracted MR IID: $MR_IID"'
    - chmod +x "$PROJECT_DIR/scripts/add_mr_note.sh"
    - bash "$PROJECT_DIR/scripts/add_mr_note.sh" "$MR_IID"
  tags:
    - docker
  rules:
    # 在 develop 分支上推送时运行（合并到 develop）
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop" && $CI_COMMIT_MESSAGE =~ /^Merge branch.*/
    # 在 test 分支上推送时运行（合并到 test）
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "test" && $CI_COMMIT_MESSAGE =~ /^Merge branch.*/
    # 在 main 分支上推送时运行（合并到 main）
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE =~ /^Merge branch.*/
  variables:
    # 注意在GitlabCE中设置好个人访问令牌后立马复制，并在添加PERSONAL_ACCESS_TOKEN时注意受保护选择是否勾选，类似于 create_release 作业
    GITLAB_TOKEN: $PERSONAL_ACCESS_TOKEN

# 部署作业模板
.deploy_template: &deploy_definition
  stage: deploy
  image: curlimages/curl:latest
  before_script: []   # 发布产物不需要构建工具链
  script:
    - echo "Deploying to ${ENVIRONMENT} environment"
    - |
      # 适配说明：docker executor 的容器是临时的，原设计"解压到 runner 本机 $HOME"
      # 在容器里没有意义（job 结束即销毁）。改为发布到 GitLab Generic Package
      # Registry 做持久化保存；如需真正落到某台环境机，用 SSH 方式另行部署。
      ARTIFACT="astroproject/${BUILD_DIR}/${ARTIFACT_NAME}"
      ls -l "$ARTIFACT"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$ARTIFACT" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${ENVIRONMENT}-${CI_COMMIT_SHORT_SHA}/${ARTIFACT_NAME}"
      echo "Published -> ${ENVIRONMENT}-${CI_COMMIT_SHORT_SHA}/${ARTIFACT_NAME}"
  # 注：GitLab 19.2 有 bug —— deploy 阶段 job 带 environment 会导致 script 校验失败，
  #     故本平台统一不在 deploy job 上使用 environment 关键字。

# 开发环境部署
deploy_to_dev:
  <<: *deploy_definition
  needs:
    - job: build_dev
      artifacts: true
    - job: verify_dev
      artifacts: true
  variables:
    ENVIRONMENT: "development"
  tags:
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"

# 测试环境部署
deploy_to_test:
  <<: *deploy_definition
  needs:
    - job: build_test
      artifacts: true
    - job: verify_test
      artifacts: true
  variables:
    ENVIRONMENT: "testing"
  tags:
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "test"

# 生产环境部署
deploy_to_prod:
  <<: *deploy_definition
  needs:
    - job: build_prod
      artifacts: true
    - job: verify_prod
      artifacts: true
  variables:
    ENVIRONMENT: "production"
  tags:
    - docker
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"

# 创建 Release 并上传构建产物
create_release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - docker
  before_script:
    - |
      # 确定版本号
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="v$CI_COMMIT_TAG"
      else
        PACKAGE_VERSION="v${CI_COMMIT_SHORT_SHA}"
      fi
      export PACKAGE_VERSION
      echo "Determined package version: $PACKAGE_VERSION"
  script:
    - |
      echo "Creating release for $PACKAGE_VERSION"
      
      # 创建发布说明（使用 shell 方式构造 JSON，避免依赖 jq）
      cat > release_data.json <<EOF
      {
        "tag_name": "$CI_COMMIT_TAG",
        "ref": "$CI_COMMIT_SHA",
        "name": "Release $PACKAGE_VERSION",
        "description": "Release created by GitLab CI/CD pipeline for AstroProject",
        "assets": {
          "links": [
            {
              "name": "$ARTIFACT_NAME",
              "url": "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/${ARTIFACT_NAME}?job=build_prod"
            }
          ]
        }
      }EOF
      
      # 使用 GitLab API 创建 Release，使用 JOB-TOKEN 而不是 PRIVATE-TOKEN
      curl --request POST \
           --header "PRIVATE-TOKEN: $PERSONAL_ACCESS_TOKEN" \
           --header "Content-Type: application/json" \
           --data @release_data.json \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
  dependencies:
    - build_prod
  needs:
    - job: build_prod
      artifacts: true

# 发布到 Package Registry
publish_package:
  stage: release
  tags:
    - docker
  before_script:
    - |
      # 确定版本号
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="$CI_COMMIT_TAG"
      else
        PACKAGE_VERSION="v${CI_COMMIT_SHORT_SHA}"
      fi
      export PACKAGE_VERSION
      echo "Determined package version: $PACKAGE_VERSION"
  script:
    - |
      # 确保变量正确设置
      echo "Uploading artifact to GitLab Package Registry"
      echo "API URL: ${CI_API_V4_URL}"
      echo "Project ID: ${CI_PROJECT_ID}"
      echo "Package Name: ${PACKAGE_NAME}"
      echo "Package Version: ${PACKAGE_VERSION}"
      echo "Artifact Name: ${ARTIFACT_NAME}"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file ${ARTIFACT_NAME} \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${ARTIFACT_NAME}"
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build_prod
  needs:
    - job: build_prod
      artifacts: true
