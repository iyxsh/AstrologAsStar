# ============================================================
# 创建 Release（tag 时触发）：assets 挂全部系统平台产物链接
# ============================================================

create_release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - docker
  before_script:
    - |
      # 注意：CI_COMMIT_TAG 已含 v 前缀(如 v0.1.0)，不要再加 v
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="$CI_COMMIT_TAG"
      else
        PACKAGE_VERSION="v${CI_COMMIT_SHORT_SHA}"
      fi
      export PACKAGE_VERSION
      echo "Determined package version: $PACKAGE_VERSION"
  script:
    - |
      set -e
      echo "Creating release for $PACKAGE_VERSION"
      export ARCH=$(uname -m)
      # 用 printf 构造 release JSON（避免 heredoc 缩进陷阱；双引号使变量展开）
      # 资产链接覆盖全部 6 个系统平台
      printf '%s\n' \
        "{" \
        "  \"tag_name\": \"$CI_COMMIT_TAG\"," \
        "  \"ref\": \"$CI_COMMIT_TAG\"," \
        "  \"name\": \"Release $PACKAGE_VERSION\"," \
        "  \"description\": \"Release created by GitLab CI/CD for AstroProject (6 linux distros)\", " \
        "  \"assets\": {" \
        "    \"links\": [" \
        "      {" \
        "        \"name\": \"astroproject-ubuntu-22.04-${ARCH}.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-ubuntu-22.04-${ARCH}.tar.gz?job=build_prod_ubuntu_22_04\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-ubuntu-24.04-${ARCH}.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-ubuntu-24.04-${ARCH}.tar.gz?job=build_prod_ubuntu_24_04\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-debian-12-${ARCH}.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-debian-12-${ARCH}.tar.gz?job=build_prod_debian_12\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-alpine-3.20-${ARCH}.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-alpine-3.20-${ARCH}.tar.gz?job=build_prod_alpine_3_20\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-rockylinux-9-${ARCH}.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-rockylinux-9-${ARCH}.tar.gz?job=build_prod_rockylinux_9\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-fedora-40-${ARCH}.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-fedora-40-${ARCH}.tar.gz?job=build_prod_fedora_40\"" \
        "      }" \
        "    ]" \
        "  }" \
        "}" > release_data.json
      cat release_data.json
      curl --request POST \
           --header "PRIVATE-TOKEN: $PERSONAL_ACCESS_TOKEN" \
           --header "Content-Type: application/json" \
           --data @release_data.json \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      echo "RELEASE_CREATED"
  dependencies:
    - build_prod_ubuntu_22_04
    - build_prod_ubuntu_24_04
    - build_prod_debian_12
    - build_prod_alpine_3_20
    - build_prod_rockylinux_9
    - build_prod_fedora_40
  needs:
    - job: build_prod_ubuntu_22_04
      artifacts: true
    - job: build_prod_ubuntu_24_04
      artifacts: true
    - job: build_prod_debian_12
      artifacts: true
    - job: build_prod_alpine_3_20
      artifacts: true
    - job: build_prod_rockylinux_9
      artifacts: true
    - job: build_prod_fedora_40
      artifacts: true


# ============================================================
# 发布到 Package Registry（tag 时触发，按系统分 job，版本带系统）
# ============================================================

publish_package_ubuntu_22_04:
  stage: release
  tags:
    - docker
  variables:
    BUILD_DIR: "build"
    PLATFORM: "ubuntu-22.04"
    PACKAGE_NAME: "astroproject-ubuntu-22.04"
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="$CI_COMMIT_TAG"
      else
        PACKAGE_VERSION="v${CI_COMMIT_SHORT_SHA}"
      fi
      export PACKAGE_VERSION
      echo "Determined package version: $PACKAGE_VERSION"
  script:
    - |
      export ARCH=$(uname -m)
      export ARTIFACT_NAME="astroproject-${PLATFORM}-${ARCH}.tar.gz"
      echo "Uploading ${PLATFORM} artifact to GitLab Package Registry"
      echo "Package: ${PACKAGE_NAME} / ${PACKAGE_VERSION} / ${ARTIFACT_NAME}"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "astroproject/${BUILD_DIR}/${ARTIFACT_NAME}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${ARTIFACT_NAME}"
      echo "Published OK: ${ARTIFACT_NAME}"
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build_prod_ubuntu_22_04
  needs:
    - job: build_prod_ubuntu_22_04
      artifacts: true

