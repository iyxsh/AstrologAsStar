# ============================================================
# 创建 Release（tag 时触发）：assets 挂双平台产物链接
# ============================================================
create_release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - docker
  before_script:
    - |
      # 确定版本号
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="v$CI_COMMIT_TAG"
      else
        PACKAGE_VERSION="v${CI_COMMIT_SHORT_SHA}"
      fi
      export PACKAGE_VERSION
      echo "Determined package version: $PACKAGE_VERSION"
  script:
    - |
      echo "Creating release for $PACKAGE_VERSION"
      export ARCH=$(uname -m)
      # 双平台资产链接（glibc + musl）
      cat > release_data.json <<EOF
      {
        "tag_name": "$CI_COMMIT_TAG",
        "ref": "$CI_COMMIT_SHA",
        "name": "Release $PACKAGE_VERSION",
        "description": "Release created by GitLab CI/CD for AstroProject (multi-platform)",
        "assets": {
          "links": [
            {
              "name": "astroproject-linux-glibc-${ARCH}.tar.gz",
              "url": "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-linux-glibc-${ARCH}.tar.gz?job=build_prod_glibc"
            },
            {
              "name": "astroproject-linux-musl-${ARCH}.tar.gz",
              "url": "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-linux-musl-${ARCH}.tar.gz?job=build_prod_musl"
            }
          ]
        }
      }EOF
      cat release_data.json
      curl --request POST \
           --header "PRIVATE-TOKEN: $PERSONAL_ACCESS_TOKEN" \
           --header "Content-Type: application/json" \
           --data @release_data.json \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
  dependencies:
    - build_prod_glibc
    - build_prod_musl
  needs:
    - job: build_prod_glibc
      artifacts: true
    - job: build_prod_musl
      artifacts: true

# ============================================================
# 发布到 Package Registry（tag 时触发，双平台分 job，版本带平台）
# ============================================================
publish_package_glibc:
  stage: release
  tags:
    - docker
  variables:
    BUILD_DIR: "build"
    PLATFORM: "linux-glibc"
    PACKAGE_NAME: "astroproject-linux-glibc"
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="$CI_COMMIT_TAG"
      else
        PACKAGE_VERSION="v${CI_COMMIT_SHORT_SHA}"
      fi
      export PACKAGE_VERSION
      echo "Determined package version: $PACKAGE_VERSION"
  script:
    - |
      export ARCH=$(uname -m)
      export ARTIFACT_NAME="astroproject-${PLATFORM}-${ARCH}.tar.gz"
      echo "Uploading ${PLATFORM} artifact to GitLab Package Registry"
      echo "Package: ${PACKAGE_NAME} / ${PACKAGE_VERSION} / ${ARTIFACT_NAME}"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "astroproject/${BUILD_DIR}/${ARTIFACT_NAME}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${ARTIFACT_NAME}"
      echo "Published OK: ${ARTIFACT_NAME}"
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build_prod_glibc
  needs:
    - job: build_prod_glibc
      artifacts: true

