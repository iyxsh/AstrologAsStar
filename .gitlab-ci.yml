# ============================================================
# 创建 Release（tag 时触发）：assets 挂全部系统平台产物链接
# ============================================================

create_release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - docker
  before_script:
    - |
      # 注意：CI_COMMIT_TAG 已含 v 前缀(如 v0.1.0)，不要再加 v
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="$CI_COMMIT_TAG"
      else
        PACKAGE_VERSION="v${CI_COMMIT_SHORT_SHA}"
      fi
      export PACKAGE_VERSION
      echo "Determined package version: $PACKAGE_VERSION"
  script:
    - |
      set -e
      echo "Creating release for $PACKAGE_VERSION"
      # 用 printf 构造 release JSON（避免 heredoc 缩进陷阱；双引号使变量展开）
      # 资产链接覆盖全部 8 个系统平台
      printf '%s\n' \
        "{" \
        "  \"tag_name\": \"$CI_COMMIT_TAG\"," \
        "  \"ref\": \"$CI_COMMIT_TAG\"," \
        "  \"name\": \"Release $PACKAGE_VERSION\"," \
        "  \"description\": \"Release created by GitLab CI/CD for AstroProject (8 platforms: 6 Linux distros + Windows(MinGW) + Android(NDK))\", " \
        "  \"assets\": {" \
        "    \"links\": [" \
        "      {" \
        "        \"name\": \"astroproject-ubuntu-22.04-${ARCH}-prod.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-ubuntu-22.04-x86_64-prod.tar.gz?job=build_prod_ubuntu_22_04\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-ubuntu-24.04-${ARCH}-prod.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-ubuntu-24.04-x86_64-prod.tar.gz?job=build_prod_ubuntu_24_04\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-debian-12-${ARCH}-prod.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-debian-12-x86_64-prod.tar.gz?job=build_prod_debian_12\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-alpine-3.20-${ARCH}-prod.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-alpine-3.20-x86_64-prod.tar.gz?job=build_prod_alpine_3_20\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-rockylinux-9-${ARCH}-prod.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-rockylinux-9-x86_64-prod.tar.gz?job=build_prod_rockylinux_9\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-fedora-40-${ARCH}-prod.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-fedora-40-x86_64-prod.tar.gz?job=build_prod_fedora_40\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-windows-${ARCH}-prod.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-windows-x86_64-prod.tar.gz?job=build_prod_windows\"" \
        "      }," \
        "      {" \
        "        \"name\": \"astroproject-android-${ARCH}-prod.tar.gz\"," \
        "        \"url\": \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/astroproject/build/astroproject-android-aarch64-prod.tar.gz?job=build_prod_android\"" \
        "      }" \
        "    ]" \
        "  }" \
        "}" > release_data.json
      cat release_data.json
      curl --request POST \
           --header "PRIVATE-TOKEN: $PERSONAL_ACCESS_TOKEN" \
           --header "Content-Type: application/json" \
           --data @release_data.json \
           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      echo "RELEASE_CREATED"
  dependencies:
    - build_prod_ubuntu_22_04
    - build_prod_ubuntu_24_04
    - build_prod_debian_12
    - build_prod_alpine_3_20
    - build_prod_rockylinux_9
    - build_prod_fedora_40
    - build_prod_windows
    - build_prod_android
  needs:
    - job: build_prod_ubuntu_22_04
      artifacts: true
    - job: build_prod_ubuntu_24_04
      artifacts: true
    - job: build_prod_debian_12
      artifacts: true
    - job: build_prod_alpine_3_20
      artifacts: true
    - job: build_prod_rockylinux_9
      artifacts: true
    - job: build_prod_fedora_40
      artifacts: true
    - job: build_prod_windows
      artifacts: true
    - job: build_prod_android
      artifacts: true


# ============================================================
